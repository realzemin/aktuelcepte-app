name: Build IndirimTrendim APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3
      with:
        gradle-version: '8.5'

    - name: Generate Release Keystore
      run: |
        keytool -genkey -v -keystore release.keystore -alias indirimtrendim -keyalg RSA -keysize 2048 -validity 10000 -storepass indirimtrendim123 -keypass indirimtrendim123 -dname "CN=Indirim Trendim, OU=Mobile, O=Indirim Trendim, L=Istanbul, ST=Istanbul, C=TR"

    - name: Build APK (Release)
      run: gradle assembleRelease

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: IndirimTrendim-APK
        path: app/build/outputs/apk/release/app-release.apk

<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>AktüelCepte - BİM, A101, ŞOK İndirim Katalogları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --primary: #d9232a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-light);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 70px;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      position: relative;
    }

    /* TOP BAR */
    .top-header {
      background: #ffffff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .logo-area { display: flex; align-items: center; gap: 8px; }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #d9232a 0%, #ef4444 100%);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: 800;
      box-shadow: 0 4px 12px rgba(217, 35, 42, 0.3);
    }
    .brand-text { font-size: 19px; font-weight: 900; color: #0f172a; letter-spacing: -0.5px; }
    .brand-text span { color: #d9232a; }

    .alarm-btn {
      background: #fef2f2;
      color: #d9232a;
      border: 1px solid #fee2e2;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }

    /* MARKET HORIZONTAL FILTER PILLS */
    .market-scroll {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }
    .market-scroll::-webkit-scrollbar { display: none; }

    .pill-btn {
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      transition: all 0.2s;
      display: flex; align-items: center; gap: 6px;
    }
    .pill-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    /* CONTENT GRID */
    .catalog-list {
      padding: 14px 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .catalog-card {
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 18px;
      overflow: hidden;
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .catalog-card:active { transform: scale(0.98); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 220px;
      background: #f1f5f9;
      overflow: hidden;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.3s;
    }
    .card-badge {
      position: absolute;
      top: 12px; left: 12px;
      background: rgba(15, 23, 42, 0.85);
      color: #fff;
      backdrop-filter: blur(6px);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .page-count-badge {
      position: absolute;
      bottom: 12px; right: 12px;
      background: rgba(0, 0, 0, 0.7);
      color: #fff;
      padding: 4px 8px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
    }

    .card-body { padding: 14px 16px; }
    .card-market-tag {
      display: inline-block;
      font-size: 11px;
      font-weight: 800;
      color: #d9232a;
      text-transform: uppercase;
      margin-bottom: 4px;
    }
    .card-title {
      font-size: 15px;
      font-weight: 800;
      color: #0f172a;
      line-height: 1.35;
      margin-bottom: 6px;
    }
    .card-date {
      font-size: 12px;
      color: var(--text-muted);
      font-weight: 600;
      display: flex; align-items: center; gap: 4px;
    }

    /* FULLSCREEN FLYER VIEWER MODAL */
    .viewer-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      flex-direction: column;
    }
    .viewer-top {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.6);
      color: #fff;
    }
    .viewer-title { font-size: 14px; font-weight: 700; max-width: 75%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .viewer-close {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 18px;
      width: 34px; height: 34px;
      border-radius: 50%;
      cursor: pointer;
    }

    .viewer-content {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      overflow: hidden;
      position: relative;
    }
    .viewer-img {
      max-width: 100%;
      max-height: 80vh;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 10px 40px rgba(0,0,0,0.8);
    }

    .viewer-bottom {
      padding: 14px 16px;
      background: rgba(0, 0, 0, 0.8);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
    }
    .page-nav-btn {
      background: #334155;
      color: #fff;
      border: none;
      padding: 10px 16px;
      border-radius: 10px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
    }
    .viewer-share-btn {
      flex: 1;
      background: #25d366;
      color: #fff;
      border: none;
      padding: 10px;
      border-radius: 10px;
      font-weight: 800;
      font-size: 13px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center; gap: 6px;
    }

    /* ADMOB BANNER */
    .admob-banner {
      width: 100%;
      height: 50px;
      background: #f1f5f9;
      border-top: 1px solid #e2e8f0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      position: sticky;
      bottom: 0;
      z-index: 30;
    }
    .admob-tag { font-size: 9px; background: #94a3b8; color: #fff; padding: 2px 5px; border-radius: 3px; font-weight: 800; }
  </style>
</head>
<body>

<div class="app-screen">
  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="logo-area">
      <div class="brand-icon">🛒</div>
      <div class="brand-text">Aktüel<span>Cepte</span></div>
    </div>
    <div class="alarm-btn" onclick="subscribeAlarm()">
      🔔 İndirim Alarmı
    </div>
  </header>

  <!-- MARKET FILTER PILLS -->
  <div class="market-scroll" id="marketFilters">
    <button class="pill-btn active" onclick="filterMarket('all', this)">🌟 Tümü</button>
    <button class="pill-btn" onclick="filterMarket('bim', this)">🔴 BİM</button>
    <button class="pill-btn" onclick="filterMarket('a101', this)">🔵 A101</button>
    <button class="pill-btn" onclick="filterMarket('sok', this)">🟡 ŞOK</button>
    <button class="pill-btn" onclick="filterMarket('tarimkredi', this)">🟢 Tarım Kredi</button>
  </div>

  <!-- CATALOG CARDS -->
  <main class="catalog-list" id="catalogContainer">
    <!-- Katalog Kartları Dinamik Yüklenir -->
  </main>

  <!-- GOOGLE ADMOB SMART BANNER -->
  <div class="admob-banner">
    <span class="admob-tag">ADMOB REKLAM</span>
    <span style="font-size: 11px; font-weight: 700; color: #475569;">Google AdMob Akıllı Banner Alanı (320x50)</span>
    <span style="font-size: 10px; color: #94a3b8;">Yayında</span>
  </div>
</div>

<!-- FULLSCREEN FLYER VIEWER MODAL -->
<div id="viewerModal" class="viewer-modal">
  <div class="viewer-top">
    <div class="viewer-title" id="viewerTitle">Katalog Görüntüleyici</div>
    <button class="viewer-close" onclick="closeViewer()">✕</button>
  </div>

  <div class="viewer-content">
    <img id="viewerImg" class="viewer-img" src="" alt="Afiş">
  </div>

  <div class="viewer-bottom">
    <button class="page-nav-btn" onclick="prevPage()">◀ Önceki</button>
    <button class="viewer-share-btn" onclick="shareToWhatsApp()">
      💬 WhatsApp'ta Paylaş
    </button>
    <button class="page-nav-btn" onclick="nextPage()">Sonraki ▶</button>
  </div>
</div>

<script>
  let allCatalogs = [];
  let currentCatalog = null;
  let currentPageIndex = 0;

  const OFFLINE_CATALOGS = [{"id": "bim-cuma-firsat", "market": "bim", "market_title": "BİM", "market_color": "#d9232a", "title": "BİM Cuma Aktüel Ürünler Kataloğu", "badge": "RESMİ AFİŞ", "date_range": "28 Kasım - 05 Aralık 2026", "cover_image": "/static/uploads/real_bim_flyer_1.jpg", "pages": ["/static/uploads/real_bim_flyer_1.jpg", "/static/uploads/real_bim_flyer_2.jpg", "/static/uploads/real_bim_flyer_3.jpg"], "category": "Elektronik & Züccaciye"}, {"id": "bim-sali-haftanin-onerileri", "market": "bim", "market_title": "BİM", "market_color": "#d9232a", "title": "BİM Salı Haftanın Önerileri", "badge": "BU HAFTA", "date_range": "25 Kasım - 02 Aralık 2026", "cover_image": "/static/uploads/real_bim_flyer_4.jpg", "pages": ["/static/uploads/real_bim_flyer_4.jpg", "/static/uploads/real_bim_flyer_5.jpg", "/static/uploads/real_bim_flyer_6.jpg"], "category": "Temel Gıda & Temizlik"}, {"id": "a101-aldin-aldin", "market": "a101", "market_title": "A101", "market_color": "#0099cc", "title": "A101 27 Kasım Perşembe Aldın Aldın!", "badge": "ALDIN ALDIN", "date_range": "27 Kasım - 04 Aralık 2026", "cover_image": "/static/uploads/a101_aldin_p1.jpg", "pages": ["/static/uploads/a101_aldin_p1.jpg"], "category": "Televizyon & Beyaz Eşya"}, {"id": "sok-carsamba", "market": "sok", "market_title": "ŞOK", "market_color": "#eab308", "title": "ŞOK 26 Kasım Çarşamba Fırsatları", "badge": "ŞOK SEVİYORUZ", "date_range": "26 Kasım - 03 Aralık 2026", "cover_image": "/static/uploads/sok_firsat_p1.jpg", "pages": ["/static/uploads/sok_firsat_p1.jpg"], "category": "Temel Gıda & Yağ"}, {"id": "tarim-kredi-indirim", "market": "tarimkredi", "market_title": "Tarım Kredi", "market_color": "#15803d", "title": "Tarım Kredi Kooperatifi İndirim Günleri", "badge": "UYGUN FİYAT", "date_range": "20 Kasım - 30 Kasım 2026", "cover_image": "/static/uploads/tarimkredi_p1.jpg", "pages": ["/static/uploads/tarimkredi_p1.jpg"], "category": "Doğal Bal, Yağ & Bakliyat"}];
  function loadCatalogs(market = 'all') {
    let list = (allCatalogs && allCatalogs.length) ? allCatalogs : OFFLINE_CATALOGS;
    if (market !== 'all') {
      list = list.filter(item => item.market === market);
    }
    renderCatalogs(list);
  }

  function renderCatalogs(catalogs) {
    const container = document.getElementById('catalogContainer');
    container.innerHTML = '';

    if (catalogs.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">Bu markete ait aktif katalog bulunamadı.</div>';
      return;
    }

    catalogs.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'catalog-card';
      card.onclick = () => openViewer(item);

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="card-thumb" src="${item.cover_image}" alt="${item.title}">
          <div class="card-badge" style="background:${item.market_color};">${item.badge}</div>
          <div class="page-count-badge">📄 ${item.pages.length} Sayfa</div>
        </div>
        <div class="card-body">
          <div class="card-market-tag" style="color:${item.market_color};">${item.market_title} • ${item.category}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-date">📅 Geçerlilik: ${item.date_range}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function filterMarket(market, btn) {
    document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadCatalogs(market);
  }

  function openViewer(item) {
    currentCatalog = item;
    currentPageIndex = 0;
    updateViewerImage();
    document.getElementById('viewerTitle').innerText = item.title;
    document.getElementById('viewerModal').style.display = 'flex';
  }

  function closeViewer() {
    document.getElementById('viewerModal').style.display = 'none';
  }

  function updateViewerImage() {
    if (currentCatalog && currentCatalog.pages.length > 0) {
      document.getElementById('viewerImg').src = currentCatalog.pages[currentPageIndex];
      document.getElementById('viewerTitle').innerText = `${currentCatalog.title} (${currentPageIndex + 1}/${currentCatalog.pages.length})`;
    }
  }

  function prevPage() {
    if (currentCatalog && currentPageIndex > 0) {
      currentPageIndex--;
      updateViewerImage();
    }
  }

  function nextPage() {
    if (currentCatalog && currentPageIndex < currentCatalog.pages.length - 1) {
      currentPageIndex++;
      updateViewerImage();
    }
  }

  function shareToWhatsApp() {
    if (currentCatalog) {
      const text = `🔥 ${currentCatalog.title} fırsat afişini incele!\nGeçerlilik: ${currentCatalog.date_range}`;
      window.open('https://api.whatsapp.com/send?text=' + encodeURIComponent(text), '_blank');
    }
  }

  function subscribeAlarm() {
    alert('🔔 İndirim Alarmı Aktif!\nBİM, A101 ve ŞOK yeni afiş yayınladığında anında bildirim alacaksınız.');
  }

  loadCatalogs('all');
</script>
</body>
</html>

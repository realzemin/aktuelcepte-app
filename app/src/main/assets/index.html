<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>AktüelCepte - BİM, A101, ŞOK İndirim Katalogları</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-light: #f8fafc;
      --card-bg: #ffffff;
      --primary: #d9232a;
      --text-main: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
      --shadow-sm: 0 2px 8px rgba(0,0,0,0.06);
      --shadow-md: 0 8px 24px rgba(0,0,0,0.08);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body {
      background: var(--bg-light);
      color: var(--text-main);
      font-family: 'Plus Jakarta Sans', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding-bottom: 70px;
    }

    .app-screen {
      width: 100%;
      max-width: 480px;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: #f8fafc;
      position: relative;
    }

    /* TOP BAR */
    .top-header {
      background: #ffffff;
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 40;
    }
    .logo-area { display: flex; align-items: center; gap: 8px; }
    .brand-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #d9232a 0%, #ef4444 100%);
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      color: #fff; font-size: 20px; font-weight: 800;
      box-shadow: 0 4px 12px rgba(217, 35, 42, 0.3);
    }
    .brand-text { font-size: 19px; font-weight: 900; color: #0f172a; letter-spacing: -0.5px; }
    .brand-text span { color: #d9232a; }

    .alarm-btn {
      background: #fef2f2;
      color: #d9232a;
      border: 1px solid #fee2e2;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex; align-items: center; gap: 4px;
    }

    /* MARKET HORIZONTAL FILTER PILLS */
    .market-scroll {
      display: flex;
      gap: 8px;
      padding: 12px 16px;
      overflow-x: auto;
      scrollbar-width: none;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
    }
    .market-scroll::-webkit-scrollbar { display: none; }

    .pill-btn {
      padding: 8px 16px;
      border-radius: 9999px;
      font-size: 13px;
      font-weight: 700;
      white-space: nowrap;
      cursor: pointer;
      border: 1px solid #e2e8f0;
      background: #f8fafc;
      color: #475569;
      transition: all 0.2s;
    }
    .pill-btn.active {
      background: #0f172a;
      color: #ffffff;
      border-color: #0f172a;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.2);
    }

    /* CATALOG CARDS */
    .catalog-list {
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .catalog-card {
      background: var(--card-bg);
      border-radius: 16px;
      overflow: hidden;
      border: 1px solid var(--border);
      box-shadow: var(--shadow-sm);
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
    }
    .catalog-card:active { transform: scale(0.98); }

    .card-thumb-wrap {
      position: relative;
      width: 100%;
      height: 240px;
      background: #e2e8f0;
      overflow: hidden;
    }
    .card-thumb {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
    }

    .card-badge {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11px;
      font-weight: 800;
      color: #fff;
      box-shadow: 0 2px 6px rgba(0,0,0,0.2);
    }
    .page-count-badge {
      position: absolute;
      bottom: 12px;
      right: 12px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(4px);
      padding: 4px 10px;
      border-radius: 8px;
      font-size: 11.5px;
      font-weight: 700;
      color: #fff;
    }

    .card-body { padding: 14px 16px; }
    .card-market-tag { font-size: 11px; font-weight: 800; text-transform: uppercase; margin-bottom: 4px; }
    .card-title { font-size: 16px; font-weight: 800; color: #0f172a; line-height: 1.35; margin-bottom: 6px; }
    .card-date { font-size: 12.5px; font-weight: 600; color: #64748b; display: flex; align-items: center; gap: 4px; }

    /* FULLSCREEN VIEWER MODAL */
    .viewer-modal {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.95);
      z-index: 100;
      flex-direction: column;
    }
    .viewer-top {
      padding: 14px 16px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: rgba(0, 0, 0, 0.8);
      color: #fff;
    }
    .viewer-title { font-size: 14px; font-weight: 700; max-width: 65%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .viewer-tools { display: flex; align-items: center; gap: 8px; }
    .tool-btn {
      background: rgba(255, 255, 255, 0.2);
      border: none;
      color: #fff;
      font-size: 14px;
      font-weight: 800;
      padding: 6px 12px;
      border-radius: 8px;
      cursor: pointer;
    }
    .viewer-close {
      background: #ef4444;
      border: none;
      color: #fff;
      font-size: 16px;
      width: 32px; height: 32px;
      border-radius: 50%;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }

    .viewer-content {
      flex: 1;
      overflow: auto;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 8px;
      touch-action: pan-x pan-y pinch-zoom;
    }
    .viewer-img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      border-radius: 8px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      transition: transform 0.2s ease;
    }

    .viewer-bottom {
      padding: 12px 16px;
      background: rgba(0, 0, 0, 0.85);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }
    .page-nav-btn {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }
    .page-nav-btn:active { background: rgba(255, 255, 255, 0.3); }
    .viewer-share-btn {
      background: #25d366;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 10px;
      font-size: 13px;
      font-weight: 800;
      cursor: pointer;
      display: flex; align-items: center; gap: 6px;
    }

    /* ADMOB BANNER */
    .admob-banner {
      margin-top: auto;
      background: #ffffff;
      border-top: 1px solid var(--border);
      padding: 10px;
      text-align: center;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .admob-tag {
      background: #d9232a;
      color: #fff;
      font-size: 9px;
      font-weight: 800;
      padding: 2px 6px;
      border-radius: 4px;
    }
  </style>
</head>
<body>

<div class="app-screen">
  <!-- TOP HEADER -->
  <header class="top-header">
    <div class="logo-area">
      <div class="brand-icon">🛒</div>
      <div class="brand-text">Aktüel<span>Cepte</span></div>
    </div>
    <button class="alarm-btn" onclick="alert('🔔 İndirim Alarmı Aktif! Yeni katalog yayınlandığında anında bildirim alacaksınız.')">
      🔔 İndirim Alarmı
    </button>
  </header>

  <!-- MARKET FILTER PILLS -->
  <div class="market-scroll">
    <button class="pill-btn active" onclick="filterMarket('all', this)">⭐ Tümü</button>
    <button class="pill-btn" onclick="filterMarket('bim', this)">🔴 BİM (4 Sayfa)</button>
    <button class="pill-btn" onclick="filterMarket('a101', this)">🔵 A101 (4 Sayfa)</button>
    <button class="pill-btn" onclick="filterMarket('sok', this)">🟡 ŞOK (6 Sayfa)</button>
    <button class="pill-btn" onclick="filterMarket('tarimkredi', this)">🟢 Tarım Kredi</button>
  </div>

  <!-- CATALOG CARDS -->
  <main class="catalog-list" id="catalogContainer">
    <!-- Katalog Kartları Dinamik Yüklenir -->
  </main>

  <!-- GOOGLE ADMOB SMART BANNER -->
  <div class="admob-banner">
    <span class="admob-tag">ADMOB REKLAM</span>
    <span style="font-size: 11px; font-weight: 700; color: #475569;">Google AdMob Akıllı Banner Alanı (320x50)</span>
    <span style="font-size: 10px; color: #94a3b8;">Yayında</span>
  </div>
</div>

<!-- FULLSCREEN FLYER VIEWER MODAL WITH ZOOM -->
<div id="viewerModal" class="viewer-modal">
  <div class="viewer-top">
    <div class="viewer-title" id="viewerTitle">Katalog Görüntüleyici</div>
    <div class="viewer-tools">
      <button class="tool-btn" onclick="zoomIn()">🔍+</button>
      <button class="tool-btn" onclick="zoomOut()">🔍-</button>
      <button class="viewer-close" onclick="closeViewer()">✕</button>
    </div>
  </div>

  <div class="viewer-content" id="viewerContent">
    <img id="viewerImg" class="viewer-img" src="" alt="Afiş">
  </div>

  <div class="viewer-bottom">
    <button class="page-nav-btn" onclick="prevPage()">◀ Önceki</button>
    <button class="viewer-share-btn" onclick="shareToWhatsApp()">
      💬 WhatsApp'ta Paylaş
    </button>
    <button class="page-nav-btn" onclick="nextPage()">Sonraki ▶</button>
  </div>
</div>

<script>
  const OFFLINE_CATALOGS = [{"id": "bim_cuma", "market": "bim", "market_title": "BİM", "market_color": "#d9232a", "title": "BİM 28 Kasım Cuma Aktüel Ürünler", "badge": "BU CUMA", "date_range": "28 Kasım – 05 Aralık 2026", "category": "Elektronik, Züccaciye & Ev Tekstili", "cover_image": "/static/uploads/bim_cuma_sayfa_1.jpg", "pages": ["/static/uploads/bim_cuma_sayfa_1.jpg", "/static/uploads/bim_cuma_sayfa_2.jpg", "/static/uploads/bim_cuma_sayfa_3.jpg", "/static/uploads/bim_cuma_sayfa_4.jpg"]}, {"id": "a101_aldin", "market": "a101", "market_title": "A101", "market_color": "#0099cc", "title": "A101 27 Kasım Aldın Aldın! Fırsat Kataloğu", "badge": "BU PERŞEMBE", "date_range": "27 Kasım – 04 Aralık 2026", "category": "Televizyon, Beyaz Eşya & Mutfak", "cover_image": "/static/uploads/a101_aldin_sayfa_1.jpg", "pages": ["/static/uploads/a101_aldin_sayfa_1.jpg", "/static/uploads/a101_aldin_sayfa_2.jpg", "/static/uploads/a101_aldin_sayfa_3.jpg", "/static/uploads/a101_aldin_sayfa_4.jpg"]}, {"id": "sok_carsamba", "market": "sok", "market_title": "ŞOK", "market_color": "#eab308", "title": "ŞOK 26 Kasım Çarşamba Fırsatları", "badge": "BU ÇARŞAMBA", "date_range": "26 Kasım – 03 Aralık 2026", "category": "Temizlik, Kişisel Bakım & Gıda", "cover_image": "/static/uploads/sok_carsamba_sayfa_1.jpg", "pages": ["/static/uploads/sok_carsamba_sayfa_1.jpg", "/static/uploads/sok_carsamba_sayfa_2.jpg", "/static/uploads/sok_carsamba_sayfa_3.jpg", "/static/uploads/sok_carsamba_sayfa_4.jpg"]}, {"id": "sok_haftasonu", "market": "sok", "market_title": "ŞOK", "market_color": "#eab308", "title": "ŞOK 29 Kasım Hafta Sonu Fırsatları", "badge": "HAFTA SONU", "date_range": "29 – 30 Kasım 2026", "category": "Oyuncak, Giyim & Ev Gereçleri", "cover_image": "/static/uploads/sok_haftasonu_sayfa_1.jpg", "pages": ["/static/uploads/sok_haftasonu_sayfa_1.jpg", "/static/uploads/sok_haftasonu_sayfa_2.jpg"]}, {"id": "tarimkredi", "market": "tarimkredi", "market_title": "Tarım Kredi", "market_color": "#15803d", "title": "Tarım Kredi Kooperatif Market İndirimleri", "badge": "BEREKETLİ", "date_range": "25 Kasım – 10 Aralık 2026", "category": "Doğal Bakliyat, Yağ & Süt Ürünleri", "cover_image": "/static/uploads/tarimkredi_sayfa_1.jpg", "pages": ["/static/uploads/tarimkredi_sayfa_1.jpg"]}];
  let allCatalogs = OFFLINE_CATALOGS;
  let currentCatalog = null;
  let currentPageIndex = 0;
  let currentZoom = 1.0;

  function loadCatalogs(market = 'all') {
    let list = allCatalogs;
    if (market !== 'all') {
      list = list.filter(item => item.market === market);
    }
    renderCatalogs(list);
  }

  function renderCatalogs(catalogs) {
    const container = document.getElementById('catalogContainer');
    container.innerHTML = '';

    if (catalogs.length === 0) {
      container.innerHTML = '<div style="text-align:center; padding:40px; color:#64748b;">Bu markete ait aktif katalog bulunamadı.</div>';
      return;
    }

    catalogs.forEach((item, index) => {
      const card = document.createElement('div');
      card.className = 'catalog-card';
      card.onclick = () => openViewer(item);

      // Support relative asset links
      let cover = item.cover_image;
      if (cover.startsWith('/static/')) cover = cover.substring(1);

      card.innerHTML = `
        <div class="card-thumb-wrap">
          <img class="card-thumb" src="${cover}" alt="${item.title}">
          <div class="card-badge" style="background:${item.market_color};">${item.badge}</div>
          <div class="page-count-badge">📄 ${item.pages.length} Sayfa</div>
        </div>
        <div class="card-body">
          <div class="card-market-tag" style="color:${item.market_color};">${item.market_title} • ${item.category}</div>
          <div class="card-title">${item.title}</div>
          <div class="card-date">📅 Geçerlilik: ${item.date_range}</div>
        </div>
      `;
      container.appendChild(card);
    });
  }

  function filterMarket(market, btn) {
    document.querySelectorAll('.pill-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    loadCatalogs(market);
  }

  function openViewer(catalog) {
    currentCatalog = catalog;
    currentPageIndex = 0;
    currentZoom = 1.0;
    document.getElementById('viewerModal').style.display = 'flex';
    updateViewerPage();
  }

  function closeViewer() {
    document.getElementById('viewerModal').style.display = 'none';
    currentCatalog = null;
    currentZoom = 1.0;
  }

  function updateViewerPage() {
    if (!currentCatalog) return;
    let pageSrc = currentCatalog.pages[currentPageIndex];
    if (pageSrc.startsWith('/static/')) pageSrc = pageSrc.substring(1);

    const img = document.getElementById('viewerImg');
    img.src = pageSrc;
    currentZoom = 1.0;
    applyZoom();

    document.getElementById('viewerTitle').innerText = 
      `${currentCatalog.market_title} - Sayfa ${currentPageIndex + 1}/${currentCatalog.pages.length}`;
  }

  function prevPage() {
    if (!currentCatalog) return;
    if (currentPageIndex > 0) {
      currentPageIndex--;
      updateViewerPage();
    }
  }

  function nextPage() {
    if (!currentCatalog) return;
    if (currentPageIndex < currentCatalog.pages.length - 1) {
      currentPageIndex++;
      updateViewerPage();
    }
  }

  function zoomIn() {
    currentZoom = Math.min(currentZoom + 0.5, 3.0);
    applyZoom();
  }

  function zoomOut() {
    currentZoom = Math.max(currentZoom - 0.5, 1.0);
    applyZoom();
  }

  function applyZoom() {
    const img = document.getElementById('viewerImg');
    img.style.transform = `scale(${currentZoom})`;
  }

  function shareToWhatsApp() {
    if (!currentCatalog) return;
    const text = `📢 ${currentCatalog.title} fırsatlarını AktüelCepte uygulamasında incele!
Geçerlilik: ${currentCatalog.date_range}`;
    const url = "https://aktuelcepte.app";
    if (window.Android && window.Android.shareApp) {
      window.Android.shareApp(text, url);
    } else {
      window.open(`https://api.whatsapp.com/send?text=${encodeURIComponent(text + ' ' + url)}`);
    }
  }

  // Initial load
  loadCatalogs('all');
</script>
</body>
</html>
